[package]
name = "matching-control"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[dependencies]
base64 = "=0.22.1"
matching-domain = { path = "../matching-domain" }
matching-orderbook = { path = "../matching-orderbook" }
matching-persistence = { path = "../matching-persistence" }
matching-runtime = { path = "../matching-runtime" }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = "=1.0.150"
ureq = { version = "=2.12.1", default-features = false, features = ["tls"] }
url = "=2.5.8"

[dev-dependencies]
matching-protocol = { path = "../matching-protocol" }
matching-risk = { path = "../matching-risk" }
ed25519-dalek = { version = "3.0.0", default-features = false }
